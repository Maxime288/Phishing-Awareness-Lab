<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f6f8fa;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    margin: 0;
  }

  .login-container {
    flex: 1;
    display: flex;
    justify-content: center;
    padding-top: 60px;
  }

  .login-box {
    width: 340px;
  }

  .login-box .logo {
    display: block;
    margin: 0 auto 24px;
    width: 48px;
    height: 48px;
  }

  .login-box h1 {
    font-size: 24px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 24px;
    color: #1f2328;
  }

  label {
    display: block;
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 6px;
    color: #1f2328;
  }

  .label-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .forgot-link {
    font-size: 12px;
    color: #0969da;
    text-decoration: none;
  }

  .forgot-link:hover {
    text-decoration: underline;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 8px 12px;
    margin-bottom: 16px;
    border: 1px solid #d1d9e0;
    border-radius: 6px;
    font-size: 14px;
  }

  input:focus {
    outline: none;
    border-color: #0969da;
    box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15);
  }

  .btn {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 12px;
    border: 1px solid transparent;
  }

  .btn-primary {
    background: #1f883d;
    color: #fff;
  }

  .btn-primary:hover {
    background: #1a7f37;
  }

  .btn-secondary {
    background: #f6f8fa;
    color: #1f2328;
    border: 1px solid #d1d9e0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-secondary:hover {
    background: #eef1f4;
  }

  .btn-secondary svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .divider {
    display: flex;
    align-items: center;
    text-align: center;
    color: #59636e;
    font-size: 13px;
    margin: 16px 0;
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    border-bottom: 1px solid #d1d9e0;
  }

  .divider::before { margin-right: 10px; }
  .divider::after { margin-left: 10px; }

  .signup-row {
    text-align: center;
    font-size: 14px;
    margin-top: 20px;
    color: #1f2328;
  }

  .signup-row a {
    color: #0969da;
    text-decoration: none;
  }

  .passkey-row {
    text-align: center;
    margin-top: 12px;
  }

  .passkey-row a {
    color: #0969da;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }

  footer {
    text-align: center;
    padding: 20px;
    background: #f6f8fa;
    font-size: 12px;
  }

  footer ul {
    list-style: none;
    display: flex;
    justify-content: center;
    gap: 24px;
    margin: 0;
    padding: 0;
  }

  footer a {
    color: #59636e;
    text-decoration: none;
  }

  footer a:hover {
    color: #0969da;
    text-decoration: underline;
  }
</style>
</head>
<body>

  <div class="login-container">
    <div class="login-box">
      <svg class="logo" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8C0 11.54 2.29 14.53 5.47 15.59C5.87 15.66 6.02 15.42 6.02 15.21C6.02 15.02 6.01 14.39 6.01 13.72C4 14.09 3.48 13.23 3.32 12.78C3.23 12.55 2.84 11.84 2.5 11.65C2.22 11.5 1.82 11.13 2.49 11.12C3.12 11.11 3.57 11.7 3.72 11.94C4.44 13.15 5.59 12.81 6.05 12.6C6.12 12.08 6.33 11.73 6.56 11.53C4.78 11.33 2.92 10.64 2.92 7.58C2.92 6.71 3.23 5.99 3.74 5.43C3.66 5.23 3.38 4.41 3.82 3.31C3.82 3.31 4.49 3.1 6.02 4.13C6.66 3.95 7.34 3.86 8.02 3.86C8.7 3.86 9.38 3.95 10.02 4.13C11.55 3.09 12.22 3.31 12.22 3.31C12.66 4.41 12.38 5.23 12.3 5.43C12.81 5.99 13.12 6.7 13.12 7.58C13.12 10.65 11.25 11.33 9.47 11.53C9.76 11.78 10.01 12.26 10.01 13.01C10.01 14.08 10 14.94 10 15.21C10 15.42 10.15 15.67 10.55 15.59C13.71 14.53 16 11.53 16 8C16 3.58 12.42 0 8 0Z" transform="scale(64)" fill="#1B1F23"/>
      </svg>

      <h1>Sign in to GitHub</h1>

      <form>
        <label for="username">Username or email address</label>
        <input type="text" id="username" name="username">

        <div class="label-row">
          <label for="password">Password</label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>
        <input type="password" id="password" name="password">

        <button type="submit" class="btn btn-primary">Sign in</button>
      </form>

      <div class="divider">or</div>

      <button class="btn btn-secondary">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12 c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24 c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
          <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039 l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
          <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36 c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
          <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571 c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
        </svg>
        Continue with Google
      </button>

      <button class="btn btn-secondary">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path fill="#000000" d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
        </svg>
        Continue with Apple
      </button>

      <div class="signup-row">
        New to GitHub? <a href="#">Create an account</a>
      </div>

      <div class="passkey-row">
        <a href="#">Sign in with a passkey</a>
      </div>
    </div>
  </div>

  <footer>
    <ul>
      <li><a href="#">Terms</a></li>
      <li><a href="#">Privacy</a></li>
      <li><a href="#">Docs</a></li>
      <li><a href="#">Contact GitHub Support</a></li>
      <li><a href="#">Manage cookies</a></li>
      <li><a href="#">Do not share my personal information</a></li>
    </ul>
  </footer>

</body>
</html>
